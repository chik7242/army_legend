<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARMY LEGEND Admin</title><link rel="stylesheet" href="/static/admin.css"></head><body><main><header><div><small>ARMY LEGEND / CONTROL</small><h1>Панель управления</h1></div><b>ADMIN</b></header><section id="stats" class="stats"></section><div class="cols"><section class="panel"><h2>Новый товар</h2><form id="productForm"><label>Название<input name="name" required></label><label>Категория<input name="category" value="Другое"></label><label>Описание<textarea name="description"></textarea></label><label>Цена в Stars<input name="price" type="number" min="1" required></label><label>URL изображения<input name="image_url" type="url"></label><button>СОЗДАТЬ ТОВАР</button></form></section><section class="panel"><h2>Загрузка ключей</h2><form id="stockForm"><label>Товар<select name="product_id" id="productSelect"></select></label><label>Ключи, по одному на строку<textarea name="keys" rows="9" required></textarea></label><button>ДОБАВИТЬ НА СКЛАД</button></form></section></div><section class="panel"><h2>Товары и остатки</h2><div id="products"></div></section><section class="panel"><h2>Последние заказы</h2><div id="orders"></div></section><p id="notice"></p></main><script src="/static/admin.js"></script></body></html>
